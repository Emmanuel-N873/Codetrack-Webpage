<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
</head>
<body>
    <!-- LOGIN SECTION -->
    <header>
        <a href="./index.html">Back to Home Page</a>
    </header>
      <main>
    <h1>This is the product page</h1>
    <div class="container" id="container"></div>

<section id="loginSection">
        <h1>Login</h1>
        <form id="LoginForm">
            <div class="UserName">
                <input
                    id="usernameInput"
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    />
                <p id="usernameError"></p>
            </div>
             <div class="Password">
                <input
                    id="passwordInput"
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    />
                <p id="passwordError"></p>

            <button id="LoginButton">Login</button>
        </form>
        <p id="LoginStatus">----</p>
</section>
    </main>
    <!--DASHBOARD SECTION-->
    <section id="dashboard" hidden>
        <div id="profile"></div>
        <hr style="color:aqua" />
        <h2>Products</h2>
        <!--Search Section-->
    <form action="" id="searchForm">
        <input type="search" name="search" id="searchInput" placeholder="Search Product" />
    </form>
    <button type="submit" id="searchButton">Search</button>
    <p id="productStatus">----</p>
    <div id="productContainer"></div>
        <h2>Add Products</h2>
    <form action="" id="productForm">
        <input id="productTittle" type="text" placeholder="Enter Product Name" />
        <input id="productPrice" type="text" placeholder="Enter Product Price" />
    </form>
    </section>
    <script src="./product.js"></script>
</body>
</html>
